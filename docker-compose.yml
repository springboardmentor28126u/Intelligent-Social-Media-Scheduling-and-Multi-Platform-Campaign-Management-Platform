x-app: &app
  build: ./Backend
  env_file: .env.docker
  environment:
    APP_ENV: production
    PYTHON_DOTENV_DISABLED: '1'
  restart: unless-stopped

services:
  postgres:
    networks:
      default:
        ipv4_address: 172.30.86.2
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    <<: *app
    networks:
      default:
        ipv4_address: 172.30.86.4
    environment:
      APP_ENV: production
      PYTHON_DOTENV_DISABLED: '1'
      FORWARDED_ALLOW_IPS: 172.30.86.3
    depends_on:
      postgres:
        condition: service_healthy
    ports: ['127.0.0.1:${API_PORT:-18000}:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  publishing-worker:
    <<: *app
    profiles: [workers]
    command: [python, publishing_worker.py, --interval, '10', --audience-hours, '0', --engagement-minutes, '0']
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; from database import engine; from sqlalchemy import text; assert b'publishing_worker.py' in Path('/proc/1/cmdline').read_bytes(); connection = engine.connect(); connection.execute(text('SELECT 1')); connection.close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  notification-worker:
    <<: *app
    profiles: [workers]
    command: [python, notification_worker.py]
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    networks:
      default:
        ipv4_address: 172.30.86.3
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports: ['127.0.0.1:${WEB_PORT:-15173}:8080']
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  postgres_data:
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.86.0/24
