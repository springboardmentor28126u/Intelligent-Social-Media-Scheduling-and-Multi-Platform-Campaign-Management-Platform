version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: socialpilot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socialpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialpilot123}
      POSTGRES_DB: ${POSTGRES_DB:-socialpilot_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socialpilot} -d ${POSTGRES_DB:-socialpilot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - socialpilot_net

  # ============================================================================
  # Redis Cache & Message Queue Service
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: socialpilot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - socialpilot_net

  # ============================================================================
  # FastAPI Backend Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialpilot_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-socialpilot}:${POSTGRES_PASSWORD:-socialpilot123}@postgres:5432/${POSTGRES_DB:-socialpilot_db}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-socialpilot_jwt_production_secret_key_2026}
      - ENVIRONMENT=production
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - socialpilot_net

  # ============================================================================
  # Next.js Frontend Service
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: socialpilot_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - socialpilot_net

  # ============================================================================
  # Nginx Reverse Proxy / Load Balancer
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: socialpilot_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - socialpilot_net

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  socialpilot_net:
    driver: bridge
